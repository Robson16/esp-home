# ============================================================================
# ESPHome Configuration - Sensor Node 02
# Remote sensor data collector for environmental monitoring
# Collects temperature, humidity, and displays data locally
# ============================================================================

esphome:
  name: sensor-node-02
  friendly_name: Sensor Node 02
  comment: "Remote data collector for environmental monitoring"
  min_version: 2025.11.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ============================================================================
# System Configuration
# ============================================================================

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret node2_api_encryption_key

ota:
  - platform: esphome
    password: !secret node_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP for recovery if WiFi connection fails
  ap:
    ssid: "Sensor-Node-02 Fallback"
    password: !secret node_fallback_ap_password

captive_portal:

web_server:
  port: 80

# ============================================================================
# Hardware Protocols
# ============================================================================

i2c:
  sda: 21
  scl: 22
  scan: true

# ============================================================================
# GPIO Outputs & Status LEDs
# ============================================================================

output:
  # GPIO 2: Status LED (for testing/diagnostics)
  - platform: gpio
    pin: 2
    id: status_led_output

light:
  # Status indicator LED - used for testing connectivity
  - platform: binary
    name: "Sensor Node 02 Status LED"
    output: status_led_output
    icon: mdi:led-on
    effects:
      - strobe:
          name: "Slow Blink"
          colors:
            - state: true
              duration: 1s
            - state: false
              duration: 1s
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              duration: 100ms
            - state: false
              duration: 100ms
      - strobe:
          name: "Alert Pattern"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms

# ============================================================================
# Sensor Components
# ============================================================================

binary_sensor:
  # Motion/Presence sensor (PIR)
  - platform: gpio
    pin: 27
    name: "Presence Node 02"
    id: presence_sensor_01
    device_class: motion

sensor:
  # Temperature sensor (DHT11)
  - platform: dht
    pin:
      number: 4
    model: DHT11
    temperature:
      name: "Temperature Sensor Node 02"
      id: temp_sensor_01
    humidity:
      name: "Humidity Sensor Node 02"
      id: humidity_sensor_01
    update_interval: 60s

  # Luminosity sensor (ADC)
  - platform: adc
    pin: 32
    name: "Luminosity Node 02"
    id: light_sensor_01
    update_interval: 5s
    attenuation: 11db
    unit_of_measurement: "%"
    filters:
      - calibrate_linear:
          - 0.0 -> 100.0
          - 3.3 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

# ============================================================================
# Display & Fonts
# ============================================================================

font:
  - file: "gfonts://Roboto"
    id: font_header
    size: 12
  - file: "gfonts://Roboto"
    id: font_data
    size: 14

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.print(0, 0, id(font_header), "ENV. MONITOR");

      if (id(temp_sensor_01).has_state()) {
        it.printf(0, 18, id(font_data), "Temp: %.1f C", id(temp_sensor_01).state);
      } else {
        it.print(0, 18, id(font_data), "Temp: Reading...");
      }

      if (id(humidity_sensor_01).has_state()) {
        it.printf(0, 34, id(font_data), "Umid: %.1f %%", id(humidity_sensor_01).state);
      } else {
        it.print(0, 34, id(font_data), "Umid: Reading...");
      }

      if (id(light_sensor_01).has_state()) {
        it.printf(0, 50, id(font_data), "Light: %.0f %%", id(light_sensor_01).state);
      } else {
        it.print(0, 50, id(font_data), "Light: Reading...");
      }

