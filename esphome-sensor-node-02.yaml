# ============================================================================
# ESPHome Configuration - Sensor Node 02
# Role: Electronics box temperature monitor with dual 5V coolers
# ============================================================================

esphome:
  name: sensor-node-02
  friendly_name: Sensor Node 02
  comment: "Electronics box temperature monitor with dual 5V coolers"
  min_version: 2025.11.0
  on_boot:
    priority: -100
    then:
      - switch.turn_off: cooler_1
      - switch.turn_off: cooler_2

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

# ============================================================================
# System Configuration & Network
# ============================================================================

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret node2_api_encryption_key

ota:
  - platform: esphome
    password: !secret node_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dBm
  ap:
    ssid: "Sensor-Node-02 Fallback"
    password: !secret node_fallback_ap_password

captive_portal:

web_server:
  port: 80

# ============================================================================
# Hardware Protocols
# ============================================================================

i2c:
  sda: 21
  scl: 22
  scan: true

time:
  - platform: sntp
    id: time_sntp
    timezone: "America/Sao_Paulo"

# ============================================================================
# Cooling Outputs
# ============================================================================

output:
  - platform: gpio
    pin: GPIO25
    id: cooler_1_output
  - platform: gpio
    pin: GPIO26
    id: cooler_2_output

switch:
  - platform: output
    name: "Box Cooler 01"
    id: cooler_1
    output: cooler_1_output
    restore_mode: ALWAYS_OFF

  - platform: output
    name: "Box Cooler 02"
    id: cooler_2
    output: cooler_2_output
    restore_mode: ALWAYS_OFF

# ============================================================================
# Sensor Components
# ============================================================================

sensor:
  - platform: bmp280_i2c
    address: 0x76
    temperature:
      name: "Box Temperature"
      id: box_temperature
      accuracy_decimals: 1
    pressure:
      name: "Box Pressure"
      id: box_pressure
    update_interval: 30s

  # Importando as temperaturas das CPUs via Home Assistant (Apenas placas da case principal)
  - platform: homeassistant
    id: cpu_temp_ha
    entity_id: sensor.system_monitor_temperatura_do_processador

  - platform: homeassistant
    id: cpu_temp_sentinel
    entity_id: sensor.192_168_1_101_cpu_thermal_0_temperature

  - platform: homeassistant
    id: cpu_temp_void
    entity_id: sensor.192_168_1_105_cpu_thermal_0_temperature

text_sensor:
  - platform: template
    name: "Box Cooling Mode"
    id: box_cooling_mode
    update_interval: 10s
    lambda: |-
      bool high_temp = id(box_temperature).state >= 42.0 || 
                       id(cpu_temp_ha).state >= 65.0 || 
                       id(cpu_temp_sentinel).state >= 65.0 || 
                       id(cpu_temp_void).state >= 65.0;
                       
      bool med_temp = id(box_temperature).state >= 34.0 || 
                      id(cpu_temp_ha).state >= 60.0 || 
                      id(cpu_temp_sentinel).state >= 60.0 || 
                      id(cpu_temp_void).state >= 60.0;
                      
      if (high_temp) {
        return {"HIGH"};
      } else if (med_temp) {
        return {"MEDIUM"};
      } else {
        return {"OFF"};
      }

# ============================================================================
# Cooling Logic
# ============================================================================

script:
  - id: update_cooling_strategy
    then:
      - if:
          condition:
            lambda: |-
              return id(box_temperature).state >= 42.0 || 
                     id(cpu_temp_ha).state >= 65.0 || 
                     id(cpu_temp_sentinel).state >= 65.0 || 
                     id(cpu_temp_void).state >= 65.0;
          then:
            - switch.turn_on: cooler_1
            - switch.turn_on: cooler_2
          else:
            - if:
                condition:
                  lambda: |-
                    return id(box_temperature).state >= 34.0 || 
                           id(cpu_temp_ha).state >= 60.0 || 
                           id(cpu_temp_sentinel).state >= 60.0 || 
                           id(cpu_temp_void).state >= 60.0;
                then:
                  - switch.turn_on: cooler_1
                  - switch.turn_off: cooler_2
                else:
                  - switch.turn_off: cooler_1
                  - switch.turn_off: cooler_2

interval:
  - interval: 30s
    then:
      - script.execute: update_cooling_strategy
