# ESPHome Configuration - Sensor Node
# Remote sensor data collector for environmental monitoring
# Collects temperature, humidity, and other sensor data

esphome:
  name: sensor-node-02
  friendly_name: Sensor Node 02
  comment: "Remote data collector for environmental monitoring"
  min_version: 2025.11.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ============================================================================
# System Configuration
# ============================================================================

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret node_api_encryption_key

ota:
  - platform: esphome
    password: !secret node_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP for recovery if WiFi connection fails
  ap:
    ssid: "Sensor-Node-02 Fallback"
    password: !secret node_fallback_ap_password

captive_portal:

# ============================================================================
# Network & Web Interface
# ============================================================================

web_server:
  port: 80

# ============================================================================
# Hardware - GPIO Configuration
# ============================================================================

output:
  # GPIO 2: Status LED (for testing/diagnostics)
  - platform: gpio
    pin: 2
    id: status_led_output

# ============================================================================
# Light & Effects (Test/Diagnostic)
# ============================================================================

light:
  # Status indicator LED - used for testing connectivity
  - platform: binary
    name: "Sensor Node 02 Status LED" # <-- NOME CORRIGIDO AQUI
    output: status_led_output
    icon: mdi:led-on
    effects:
      - strobe:
          name: "Slow Blink"
          colors:
            - state: true
              duration: 1s
            - state: false
              duration: 1s
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              duration: 100ms
            - state: false
              duration: 100ms
      - strobe:
          name: "Alert Pattern"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms
# ============================================================================
# Sensor Components
# ============================================================================

# Temperature sensor
sensor:
  - platform: dht
    pin:
      number: 21
    model: DHT11
    temperature:
      name: "Temperature Sensor Node 02" # <-- NOME CORRIGIDO AQUI
    humidity:
      name: "Umidade Sensor Node 02" # <-- NOME CORRIGIDO AQUI
    update_interval: 60s

