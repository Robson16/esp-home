# ============================================================================
# ESPHome Configuration - Sensor Node 02
# Role: Environmental Monitor (Node 2)
# ============================================================================

esphome:
  name: sensor-node-02
  friendly_name: Sensor Node 02

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

# ============================================================================
# System Configuration & Network
# ============================================================================

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret node2_api_encryption_key

ota:
  - platform: esphome
    password: !secret node_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  output_power: 8.5dBm # Reduce power to minimize interference with other devices

  # Fallback AP for recovery if WiFi connection fails
  ap:
    ssid: "Sensor-Node-02 Fallback"
    password: !secret node_fallback_ap_password

web_server:
  port: 80

i2c:
  sda: 21
  scl: 22
  scan: true

time:
  - platform: sntp
    id: time_sntp
    timezone: "America/Sao_Paulo"

# ============================================================================
# Fonts & Icons Configuration
# ============================================================================

font:
  - file: "gfonts://Roboto"
    id: font_header
    size: 12
  - file: "gfonts://Roboto"
    id: font_data
    size: 14
  - file: "gfonts://Roboto"
    id: font_data_large
    size: 18
  - file: "./fonts/materialdesignicons-webfont.ttf"
    id: font_icon
    size: 24
    glyphs:
      - "\U000F050F" # mdi-thermometer
      - "\U000F058E" # mdi-water-percent
      - "\U000F029A" # mdi-gauge
      - "\U000F00DF" # mdi-brightness

# ============================================================================
# Binary Sensors & Scripts
# ============================================================================

# binary_sensor:
#   - platform: gpio
#     pin: 27
#     name: "Presence Node 02"
#     id: presence_sensor_02
#     device_class: motion

# ============================================================================
# Sensor Components
# ============================================================================

sensor:
  # DHT22 (Temperature/Humidity)
  - platform: dht
    pin: 4
    model: DHT22
    temperature:
      name: "DHT Temperature Node 02"
      id: dht_temperature_02
    humidity:
      name: "DHT Humidity Node 02"
      id: dht_humidity_02
    update_interval: 60s

  # BMP280 (Temperature/Pressure)
  # - platform: bmp280_i2c
  #   address: 0x76
  #   temperature:
  #     name: "BMP Temperature Node 02"
  #     id: bmp_temperature_02
  #   pressure:
  #     name: "BMP Pressure Node 02"
  #     id: bmp_pressure_02
  #   update_interval: 30s

  # Luminosity (LDR)
  - platform: adc
    pin: 34
    name: "Luminosity Node 02"
    id: light_sensor_02
    update_interval: 60s
    attenuation: 12db
    unit_of_measurement: "%"
    filters:
      - calibrate_linear:
          - 0.0 -> 100.0
          - 3.3 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
