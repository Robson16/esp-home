# ============================================================================
# ESPHome Configuration - Sensor Node 02
# Raspberry Pi Cluster Monitor
# Collects BMP280 Temp/Pressure, Pi Voltage, Ambient Light, Controls 2 Coolers
# ============================================================================

esphome:
  name: sensor-node-02
  friendly_name: Sensor Node 02
  comment: "Raspberry Cluster Monitor"
  min_version: 2025.11.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ============================================================================
# System Configuration
# ============================================================================

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret node2_api_encryption_key

ota:
  - platform: esphome
    password: !secret node_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP for recovery if WiFi connection fails
  ap:
    ssid: "Sensor-Node-02 Fallback"
    password: !secret node_fallback_ap_password

captive_portal:

web_server:
  port: 80

# ============================================================================
# Time Component (Internet Clock)
# ============================================================================

time:
  - platform: sntp
    id: time_sntp
    timezone: "America/Sao_Paulo"

# ============================================================================
# Hardware Protocols
# ============================================================================

i2c:
  sda: 21
  scl: 22
  scan: true

# ============================================================================
# GPIO Switches (Coolers & Virtual Backlight)
# ============================================================================

switch:
  # GPIO 5: Cooler 01
  - platform: gpio
    pin: 5
    name: "Cluster Cooler 01"
    id: cooler_fan_01
    icon: "mdi:fan"

  # GPIO 18: Cooler 02
  - platform: gpio
    pin: 18
    name: "Cluster Cooler 02"
    id: cooler_fan_02
    icon: "mdi:fan"

  # Virtual Switch for LCD Backlight via I2C
  - platform: template
    name: "Cluster Display Backlight"
    id: virtual_lcd_backlight
    icon: "mdi:monitor-shimmer"
    optimistic: true
    turn_on_action:
      - lambda: "id(lcd_display).backlight();"
    turn_off_action:
      - lambda: "id(lcd_display).no_backlight();"

# ============================================================================
# Sensor Components
# ============================================================================

sensor:
  # Pi Throttling / Voltage Monitor (Voltage Divider 1:2)
  - platform: adc
    pin: 34
    name: "Pi Cluster Voltage"
    id: pi_voltage_01
    update_interval: 10s
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 2.0

  # Ambient Light Sensor (LDR) - Logic to control Display Backlight (Temporary solution until we add a dedicated BH1750 or similar)
  - platform: adc
    pin: 35 # Using GPIO 35 (ADC1) to avoid Wi-Fi conflicts
    name: "Cluster Ambient Light"
    id: cluster_ldr
    update_interval: 10s
    attenuation: 12db
    unit_of_measurement: "%"
    filters:
      - calibrate_linear:
          - 0.0 -> 100.0
          - 3.3 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
    # Automation: Backlight Control based on light levels
    on_value_range:
      - above: 50.0 # Bright enough (Day)
        then:
          - switch.turn_on: virtual_lcd_backlight
      - below: 35.0 # Too dark (Night)
        then:
          - switch.turn_off: virtual_lcd_backlight

  # Temperature & Pressure (BMP280) with Automation Logic
  - platform: bmp280_i2c
    address: 0x76
    update_interval: 10s
    pressure:
      name: "Cluster Pressure"
      id: cluster_pressure
    temperature:
      name: "Cluster Temperature"
      id: cluster_temp
      on_value:
        then:
          - if:
              condition:
                lambda: "return x >= 30.0;"
              then:
                - switch.turn_on: cooler_fan_01
                - switch.turn_on: cooler_fan_02
          - if:
              condition:
                lambda: "return x <= 28.0;"
              then:
                - switch.turn_off: cooler_fan_01
                - switch.turn_off: cooler_fan_02

# ============================================================================
# Display (LCD 1602 I2C)
# ============================================================================

display:
  - platform: lcd_pcf8574
    dimensions: 16x2
    address: 0x27
    id: lcd_display
    lambda: |-
      if (id(cluster_temp).has_state()) {
        it.printf(0, 0, "Tmp:%.1fC", id(cluster_temp).state);
      } else {
        it.print(0, 0, "Tmp:---");
      }

      if (id(cooler_fan_01).state) {
        it.print(10, 0, "FAN:ON");
      } else {
        it.print(10, 0, "FAN:- ");
      }

      if (id(pi_voltage_01).has_state()) {
        it.printf(0, 1, "Pi V:%.2fV", id(pi_voltage_01).state);
      } else {
        it.print(0, 1, "Pi V:---");
      }

      if (id(time_sntp).now().is_valid()) {
        it.strftime(11, 1, "%H:%M", id(time_sntp).now());
      } else {
        it.print(11, 1, "--:--");
      }
