# ============================================================================
# ESPHome Configuration - Sensor Node 02
# Raspberry Pi Cluster Monitor
# ============================================================================

esphome:
  name: sensor-node-02
  friendly_name: Sensor Node 02
  comment: "Raspberry Cluster Monitor"
  min_version: 2025.11.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ============================================================================
# System Configuration
# ============================================================================

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret node2_api_encryption_key

ota:
  - platform: esphome
    password: !secret node_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP for recovery if WiFi connection fails
  ap:
    ssid: "Sensor-Node-02 Fallback"
    password: !secret node_fallback_ap_password

captive_portal:

web_server:
  port: 80

# ============================================================================
# Time Component (Internet Clock & LCD Automation)
# ============================================================================

time:
  - platform: sntp
    id: time_sntp
    timezone: "America/Sao_Paulo"
    on_time:
      # --- TURN ON TRIGGER (07:00 AM) ---
      - seconds: 0
        minutes: 0
        hours: 7
        then:
          - lambda: "id(lcd_display).backlight();"
          - switch.turn_on: virtual_lcd_backlight

      # --- TURN OFF TRIGGER (06:00 PM) ---
      - seconds: 0
        minutes: 0
        hours: 18
        then:
          - lambda: "id(lcd_display).no_backlight();"
          - switch.turn_off: virtual_lcd_backlight

# ============================================================================
# Hardware Protocols
# ============================================================================

i2c:
  sda: 21
  scl: 22
  scan: true

# ============================================================================
# GPIO Switches (Coolers & Virtual Backlight)
# ============================================================================

switch:
  # GPIO 5: Cooler 01 (Primary Exhaust)
  - platform: gpio
    pin: 5
    name: "Output Cooler 01"
    id: output_cooler_fan_01
    icon: "mdi:fan"

  # GPIO 18: Cooler 02 (Secondary Exhaust)
  - platform: gpio
    pin: 18
    name: "Output Cooler 02"
    id: output_cooler_fan_02
    icon: "mdi:fan"

  # Virtual Switch for LCD Backlight via Home Assistant
  - platform: template
    name: "Cluster Display Backlight"
    id: virtual_lcd_backlight
    icon: "mdi:monitor-shimmer"
    optimistic: true
    turn_on_action:
      - lambda: "id(lcd_display).backlight();"
    turn_off_action:
      - lambda: "id(lcd_display).no_backlight();"

# ============================================================================
# Sensor Components (Multi-Stage Hysteresis)
# ============================================================================

sensor:
  # BMP280 Temp/Pressure Sensor
  - platform: bmp280_i2c
    address: 0x76
    update_interval: 10s
    pressure:
      name: "Cluster Pressure"
      id: cluster_pressure
    temperature:
      name: "Cluster Temperature"
      id: cluster_temp
      on_value:
        then:
          # --- ACCELERATION TRIGGERS (HEATING UP) ---

          # Stage 1 (Moderate): Turn on Primary Cooler
          - if:
              condition:
                lambda: "return x >= 35.0;"
              then:
                - switch.turn_on: output_cooler_fan_01

          # Stage 2 (Hot): Turn on Secondary Cooler
          - if:
              condition:
                lambda: "return x >= 40.0;"
              then:
                - switch.turn_on: output_cooler_fan_02

          # --- DECELERATION TRIGGERS (COOLING DOWN) ---

          # Temperature dropped slightly, turn off Secondary Cooler
          - if:
              condition:
                lambda: "return x <= 38.0;"
              then:
                - switch.turn_off: output_cooler_fan_02

          # Temperature stabilized, turn off Primary Cooler
          - if:
              condition:
                lambda: "return x <= 32.0;"
              then:
                - switch.turn_off: output_cooler_fan_01

# ============================================================================
# Display (LCD 1602 I2C)
# ============================================================================

display:
  - platform: lcd_pcf8574
    dimensions: 16x2
    address: 0x27
    id: lcd_display
    lambda: |-
      // Row 0: Temperature
      if (id(cluster_temp).has_state()) {
        it.printf(0, 0, "Tmp:%.1fC", id(cluster_temp).state);
      } else {
        it.print(0, 0, "Tmp:---");
      }

      // Row 0: Dynamic Fan Status (0, 1, or 2)
      if (id(output_cooler_fan_01).state && id(output_cooler_fan_02).state) {
        it.print(10, 0, "FAN: 2");
      } else if (id(output_cooler_fan_01).state) {
        it.print(10, 0, "FAN: 1");
      } else {
        it.print(10, 0, "FAN: 0");
      }

      // Row 1: Clock
      if (id(time_sntp).now().is_valid()) {
        it.strftime(11, 1, "%H:%M", id(time_sntp).now());
      } else {
        it.print(11, 1, "--:--");
      }
