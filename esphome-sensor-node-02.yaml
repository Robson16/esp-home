# ============================================================================
# ESPHome Configuration - Sensor Node 02
# Role: Environmental Monitor (Node 2)
# ============================================================================

esphome:
  name: sensor-node-02
  friendly_name: Sensor Node 02
  # on_boot:
  #   priority: -100
  #   then:
  #     - script.execute: display_timer

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

# --- System ---
logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret node2_api_encryption_key

ota:
  - platform: esphome
    password: !secret node_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: 21
  scl: 22
  scan: true

time:
  - platform: sntp
    id: time_sntp
    timezone: "America/Sao_Paulo"

# --- Fonts ---
font:
  - file: "gfonts://Roboto"
    id: font_header
    size: 12
  - file: "gfonts://Roboto"
    id: font_data
    size: 14
  - file: "gfonts://Roboto"
    id: font_data_large
    size: 18
  - file: "./fonts/materialdesignicons-webfont.ttf"
    id: font_icon
    size: 24
    glyphs:
      - "\U000F050F" # mdi-thermometer
      - "\U000F058E" # mdi-water-percent
      - "\U000F029A" # mdi-gauge
      - "\U000F00DF" # mdi-brightness

# --- Binary Sensors & Scripts ---
binary_sensor:
  - platform: gpio
    pin: 27
    name: "Presence Node 02"
    id: presence_sensor_02
    device_class: motion
    # on_press:
    #   then:
    #     - script.execute: display_timer

    # script:
    #   - id: display_timer
    #     mode: restart
    #     then:
    #       - lambda: "id(oled_display).turn_on();"
    #       - delay: 1min
    #       - lambda: "id(oled_display).turn_off();"

    # --- Environmental Sensors ---
sensor:
  # DHT22 (Temp/Humid)
  - platform: dht
    pin: 4
    model: DHT22
    temperature:
      name: "DHT Temp Node 02"
      id: dht_temp_02
    humidity:
      name: "Humidity Node 02"
      id: humidity_02
    update_interval: 30s

  # BMP280 (Temp/Pressure)
  - platform: bmp280_i2c
    address: 0x76
    temperature:
      name: "BMP Temp Node 02"
      id: bmp_temp_02
    pressure:
      name: "Pressure Node 02"
      id: bmp_pressure_02
    update_interval: 30s

  # Luminosity (LDR)
  - platform: adc
    pin: 34
    name: "Luminosity Node 02"
    id: luminosity_02
    unit_of_measurement: "%"
    filters:
      - calibrate_linear:
          - 0.0 -> 100.0
          - 3.3 -> 0.0
    update_interval: 10s

# --- Display OLED ---
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3c
    id: oled_display
    pages:
      - id: page1
        lambda: |-
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "ENVIRONMENT");
          it.print(0, 18, id(font_icon), "\U000F050F"); 
          it.printf(30, 20, id(font_data_large), "%.1f°C", id(bmp_temp_02).state);
          it.print(0, 44, id(font_icon), "\U000F058E");
          it.printf(30, 46, id(font_data), "Hum: %.1f%%", id(humidity_02).state);

      - id: page2
        lambda: |-
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "ATMOSPHERE");
          it.print(0, 18, id(font_icon), "\U000F029A");
          it.printf(30, 20, id(font_data), "Pres: %.0f hPa", id(bmp_pressure_02).state);
          it.print(0, 44, id(font_icon), "\U000F00DF");
          it.printf(30, 46, id(font_data), "Light: %.0f%%", id(luminosity_02).state);

interval:
  - interval: 5s
    then:
      - display.page.show_next: oled_display
      - component.update: oled_display
