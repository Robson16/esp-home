# ============================================================================
# ESPHome Configuration - Sensor Node 02
# Raspberry Pi Cluster Monitor (OLED 3.3V Edition)
# ============================================================================

esphome:
  name: sensor-node-02
  friendly_name: Sensor Node 02
  comment: "Raspberry Cluster Monitor"
  min_version: 2025.11.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

# ============================================================================
# System Configuration
# ============================================================================

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret node2_api_encryption_key

ota:
  - platform: esphome
    password: !secret node_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Sensor-Node-02 Fallback"
    password: !secret node_fallback_ap_password

captive_portal:

web_server:
  port: 80

# ============================================================================
# Fonts & Icons Configuration (Required for OLED)
# ============================================================================

font:
  - file: "gfonts://Roboto"
    id: font_header
    size: 12
  - file: "gfonts://Roboto"
    id: font_data
    size: 14
  - file: "gfonts://Roboto"
    id: font_data_large
    size: 18

  - file: "./fonts/materialdesignicons-webfont.ttf"
    id: font_icon
    size: 18
    glyphs:
      - "\U000F050F" # mdi-thermometer
      - "\U000F0210" # mdi-fan
      - "\U000F043F" # mdi-raspberry-pi
      - "\U000F035B" # mdi-memory

# ============================================================================
# Time Component & Display Automation
# ============================================================================

time:
  - platform: sntp
    id: time_sntp
    timezone: "America/Sao_Paulo"
    on_time:
      # --- TURN ON TRIGGER (07:00 AM) ---
      - seconds: 0
        minutes: 0
        hours: 7
        then:
          - lambda: "id(oled_display).turn_on();"
          - switch.turn_on: virtual_display_switch

      # --- TURN OFF TRIGGER (06:00 PM) ---
      - seconds: 0
        minutes: 0
        hours: 18
        then:
          - lambda: "id(oled_display).turn_off();"
          - switch.turn_off: virtual_display_switch

# ============================================================================
# Hardware Protocols
# ============================================================================

i2c:
  sda: 21
  scl: 22
  scan: true

# ============================================================================
# External Sensors (Imported from Home Assistant for Pagination)
# ============================================================================

sensor:
  # Node Pi 01 CPU Temp (.101)
  - platform: homeassistant
    id: node01_cpu_temp
    entity_id: sensor.192_168_1_101_cpu_thermal_0_temperature
    internal: true

  # Node Pi 01 CPU Usage (.101)
  - platform: homeassistant
    id: node01_cpu_usage
    entity_id: sensor.192_168_1_101_cpu_usage
    internal: true

  # Node Pi 01 RAM Usage (.101)
  - platform: homeassistant
    id: node01_ram_usage
    entity_id: sensor.192_168_1_101_memory_usage
    internal: true

  # Node Pi 02 CPU Temp (.102)
  - platform: homeassistant
    id: node02_cpu_temp
    entity_id: sensor.192_168_1_102_cpu_thermal_0_temperature
    internal: true

  # Node Pi 02 CPU Usage (.102)
  - platform: homeassistant
    id: node02_cpu_usage
    entity_id: sensor.192_168_1_102_cpu_usage
    internal: true

  # Node Pi 02 RAM Usage (.102)
  - platform: homeassistant
    id: node02_ram_usage
    entity_id: sensor.192_168_1_102_memory_usage
    internal: true

  # BMP280 Temp/Pressure Sensor (Local Hardware)
  - platform: bmp280_i2c
    address: 0x76
    update_interval: 10s
    pressure:
      name: "Cluster Pressure"
      id: cluster_pressure
    temperature:
      name: "Cluster Temperature"
      id: cluster_temp
      on_value:
        then:
          # --- ACCELERATION TRIGGERS ---
          - if:
              condition: { lambda: "return x >= 35.0;" }
              then: [ { switch.turn_on: output_cooler_fan_01 } ]
          - if:
              condition: { lambda: "return x >= 40.0;" }
              then: [ { switch.turn_on: output_cooler_fan_02 } ]

          # --- DECELERATION TRIGGERS ---
          - if:
              condition: { lambda: "return x <= 37.0;" }
              then: [ { switch.turn_off: output_cooler_fan_02 } ]
          - if:
              condition: { lambda: "return x <= 32.0;" }
              then: [ { switch.turn_off: output_cooler_fan_01 } ]

# ============================================================================
# GPIO Switches
# ============================================================================

switch:
  # Primary Exhaust
  - platform: gpio
    pin: 5
    name: "Output Cooler 01"
    id: output_cooler_fan_01
    icon: "mdi:fan"

  # Secondary Exhaust
  - platform: gpio
    pin: 18
    name: "Output Cooler 02"
    id: output_cooler_fan_02
    icon: "mdi:fan"

  # Virtual Switch for OLED via Home Assistant
  - platform: template
    name: "Cluster Display Power"
    id: virtual_display_switch
    icon: "mdi:monitor"
    optimistic: true
    turn_on_action:
      - lambda: "id(oled_display).turn_on();"
    turn_off_action:
      - lambda: "id(oled_display).turn_off();"

# ============================================================================
# Display (SSD1306 OLED I2C)
# ============================================================================

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3c
    id: oled_display
    pages:
      # PAGE 1: Case Environment & Fans
      - id: page1
        lambda: |-
          // Header
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "CASE ENVIRONMENT");

          // Temperature (Line 1)
          if (id(cluster_temp).has_state()) {
            it.print(0, 16, id(font_icon), "\U000F050F"); // Thermometer
            it.printf(28, 18, id(font_data_large), "%.1f°C", id(cluster_temp).state);
          } else {
            it.print(0, 16, id(font_icon), "\U000F050F");
            it.print(28, 18, id(font_data_large), "---");
          }

          // Active Fans Count (Line 2)
          int active_fans = 0;
          if (id(output_cooler_fan_01).state) active_fans++;
          if (id(output_cooler_fan_02).state) active_fans++;

          it.print(0, 42, id(font_icon), "\U000F0210"); // Fan
          it.printf(28, 44, id(font_data), "Fans: %d", active_fans);

      # PAGE 2: Node 01 Resources
      - id: page2
        lambda: |-
          // Header
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "PI NODE 01");

          // Line 1: Temperature
          it.print(0, 14, id(font_icon), "\U000F050F"); // Thermometer Icon
          if (id(node01_cpu_temp).has_state()) {
            it.printf(28, 16, id(font_data), "Tmp: %.1fC", id(node01_cpu_temp).state);
          } else {
            it.print(28, 16, id(font_data), "Tmp: ---");
          }

          // Line 2: CPU Usage
          it.print(0, 30, id(font_icon), "\U000F043F"); // Raspberry Pi Icon
          if (id(node01_cpu_usage).has_state()) {
            it.printf(28, 32, id(font_data), "CPU: %.0f%%", id(node01_cpu_usage).state);
          } else {
            it.print(28, 32, id(font_data), "CPU: ---");
          }

          // Line 3: RAM Usage
          it.print(0, 46, id(font_icon), "\U000F035B"); // Memory Icon
          if (id(node01_ram_usage).has_state()) {
            it.printf(28, 48, id(font_data), "RAM: %.0f%%", id(node01_ram_usage).state);
          } else {
            it.print(28, 48, id(font_data), "RAM: ---");
          }

      # PAGE 3: Node 02 Resources
      - id: page3
        lambda: |-
          // Header
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "PI NODE 02");

          // Line 1: Temperature
          it.print(0, 14, id(font_icon), "\U000F050F"); // Thermometer Icon
          if (id(node02_cpu_temp).has_state()) {
            it.printf(28, 16, id(font_data), "Tmp: %.1fC", id(node02_cpu_temp).state);
          } else {
            it.print(28, 16, id(font_data), "Tmp: ---");
          }

          // Line 2: CPU Usage
          it.print(0, 30, id(font_icon), "\U000F043F"); // Raspberry Pi Icon
          if (id(node02_cpu_usage).has_state()) {
            it.printf(28, 32, id(font_data), "CPU: %.0f%%", id(node02_cpu_usage).state);
          } else {
            it.print(28, 32, id(font_data), "CPU: ---");
          }

          // Line 3: RAM Usage
          it.print(0, 46, id(font_icon), "\U000F035B"); // Memory Icon
          if (id(node02_ram_usage).has_state()) {
            it.printf(28, 48, id(font_data), "RAM: %.0f%%", id(node02_ram_usage).state);
          } else {
            it.print(28, 48, id(font_data), "RAM: ---");
          }

      # PAGE 4: Dedicated Clock & Date
      - id: page4
        lambda: |-
          // Header
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "LOCAL TIME");

          if (id(time_sntp).now().is_valid()) {
            // Large centered time
            it.strftime(64, 24, id(font_data_large), TextAlign::TOP_CENTER, "%H:%M", id(time_sntp).now());
            
            // Standard centered date below
            it.strftime(64, 46, id(font_data), TextAlign::TOP_CENTER, "%d/%m/%Y", id(time_sntp).now());
          } else {
            it.printf(64, 24, id(font_data_large), TextAlign::TOP_CENTER, "--:--");
          }

# ============================================================================
# Automation: Rotate Pages every 10 seconds
# ============================================================================

interval:
  - interval: 10s
    then:
      - display.page.show_next: oled_display
      - component.update: oled_display
