# ============================================================================
# ESPHome Configuration - Sensor Node 01
# Bedroom Environment Monitor
# Collects Temp, Humidity, Pressure, Gas, CO, Brightness, and Presence
# ============================================================================

esphome:
  name: sensor-node-01
  friendly_name: Sensor Node 01
  comment: "Bedroom environmental monitoring"
  min_version: 2025.11.0
  # Automatically starts the 1-minute display timer when powered on
  on_boot:
    priority: -100
    then:
      - script.execute: display_timer

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ============================================================================
# System Configuration & Network
# ============================================================================

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret node1_api_encryption_key

ota:
  - platform: esphome
    password: !secret node_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP for recovery if WiFi connection fails
  ap:
    ssid: "Sensor-Node-01 Fallback"
    password: !secret node_fallback_ap_password

captive_portal:

web_server:
  port: 80

# ============================================================================
# Fonts & Icons Configuration
# ============================================================================

font:
  - file: "gfonts://Roboto"
    id: font_header
    size: 12

  - file: "gfonts://Roboto"
    id: font_data
    size: 14

  - file: "gfonts://Roboto"
    id: font_data_large
    size: 22 # Giant value to center on the screen

  - file: "./fonts/materialdesignicons-webfont.ttf"
    id: font_icon_large
    size: 34 # Well-highlighted icon
    glyphs:
      - "\U000F050F" # mdi-thermometer
      - "\U000F058E" # mdi-water-percent
      - "\U000F029A" # mdi-gauge
      - "\U000F00DF" # mdi-brightness
      - "\U000F1A1B" # mdi-gas-burner
      - "\U000F12FE" # mdi-molecule-co
      - "\U000F07E4" # mdi-molecule-co2

# ============================================================================
# Time Component (Internet Clock)
# ============================================================================
time:
  - platform: sntp
    id: relogio_sntp
    timezone: "America/Sao_Paulo"

# ============================================================================
# Hardware Protocols
# ============================================================================

i2c:
  sda: 21
  scl: 22
  scan: true

# ============================================================================
# SPI Protocol (For 7-Segment Display)
# ============================================================================

spi:
  clk_pin: 18
  mosi_pin: 23

# ============================================================================
# GPIO Outputs & Status LEDs
# ============================================================================

output:
  # GPIO 2: Status LED (for testing/diagnostics)
  - platform: gpio
    pin: 2
    id: status_led_output

light:
  - platform: binary
    name: "Sensor Node 01 Status LED"
    output: status_led_output
    id: node_01_led
    icon: mdi:led-on

# ============================================================================
# Binary Sensors & Automations
# ============================================================================

binary_sensor:
  # Motion/Presence sensor (PIR)
  - platform: gpio
    pin: 27
    name: "Presence Node 01"
    id: presence_sensor_01
    device_class: motion
    # Action when motion is detected
    on_press:
      then:
        # 1. Flash the internal blue LED for 200ms
        - light.turn_on: node_01_led
        - delay: 200ms
        - light.turn_off: node_01_led
        # 2. Start or reset the display timeout script
        - script.execute: display_timer

# ============================================================================
# Scripts
# ============================================================================

script:
  # Timer that keeps the OLED display on for 1 minute
  - id: display_timer
    mode: restart # This makes the timer reset to 0 every time motion is detected
    then:
      - lambda: "id(my_oled_display).turn_on();"
      - delay: 1min
      - lambda: "id(my_oled_display).turn_off();"

# ============================================================================
# Sensor Components
# ============================================================================

sensor:
  # Temperature & Humidity (DHT22)
  - platform: dht
    pin: 4
    model: DHT22
    temperature:
      name: "DHT Temp Node 01"
      id: dht_temp_01
    humidity:
      name: "Humidity Node 01"
      id: humidity_01
    update_interval: 60s

  # Temperature & Pressure (BMP280)
  - platform: bmp280_i2c
    temperature:
      name: "BMP Temp Node 01"
      id: bmp_temp_01
    pressure:
      name: "Pressure Node 01"
      id: bmp_pressure_01
    address: 0x76 # Change to 0x77 if not detected
    update_interval: 60s

  # Flammable Gas Sensor (MQ-2) converted to Percentage
  - platform: adc
    pin: 35
    name: "MQ-2 Gas Node 01"
    id: mq2_gas_01
    update_interval: 10s
    attenuation: 12db
    unit_of_measurement: "%"
    filters:
      - calibrate_linear:
          - 0.17 -> 0.0
          - 3.3 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

  # Carbon Monoxide Sensor (MQ-7) converted to Percentage
  - platform: adc
    pin: 32
    name: "MQ-7 CO Node 01"
    id: mq7_co_01
    update_interval: 10s
    attenuation: 12db
    unit_of_measurement: "%"
    filters:
      - calibrate_linear:
          - 0.21 -> 0.0
          - 3.3 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

  # Air Quality Sensor (MQ-135) converted to Percentage
  - platform: adc
    pin: 33
    name: "MQ-135 Air Quality Node 01"
    id: mq135_gas_01
    update_interval: 10s
    attenuation: 12db
    unit_of_measurement: "%"
    filters:
      - calibrate_linear:
          - 0.21 -> 0.0
          - 3.3 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

  # Luminosity sensor (ADC)
  - platform: adc
    pin: 34
    name: "Luminosity Node 01"
    id: light_sensor_01
    update_interval: 5s
    attenuation: 12db
    unit_of_measurement: "%"
    filters:
      - calibrate_linear:
          - 0.0 -> 100.0
          - 3.3 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

# ============================================================================
# Displays (OLED I2C & MAX7219 SPI)
# ============================================================================

display:
  # --- Display 1: OLED I2C ---
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3c
    id: my_oled_display
    pages:
      # PAGE 1: Temperature
      - id: page1
        lambda: |-
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "TEMPERATURE");

          if (id(dht_temp_01).has_state()) {
            // Icon and data lowered to the blue band (if using a yellow/blue OLED)
            it.print(10, 20, id(font_icon_large), "\U000F050F"); // mdi-thermometer
            it.printf(55, 25, id(font_data_large), "%.1f°C", id(dht_temp_01).state);
          }

      # PAGE 2: Humidity
      - id: page2
        lambda: |-
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "HUMIDITY");

          if (id(humidity_01).has_state()) {
            it.print(10, 20, id(font_icon_large), "\U000F058E"); // mdi-water-percent
            it.printf(55, 25, id(font_data_large), "%.1f%%", id(humidity_01).state);
          }

      # PAGE 3: Pressure
      - id: page3
        lambda: |-
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "PRESSURE");

          if (id(bmp_pressure_01).has_state()) {
            it.print(5, 20, id(font_icon_large), "\U000F029A"); // mdi-gauge
            it.printf(50, 25, id(font_data_large), "%.0f", id(bmp_pressure_01).state);
          }

      # PAGE 4: Luminosity
      - id: page4
        lambda: |-
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "BRIGHTNESS");

          if (id(light_sensor_01).has_state()) {
            it.print(10, 20, id(font_icon_large), "\U000F00DF"); // mdi-brightness
            it.printf(55, 25, id(font_data_large), "%.0f%%", id(light_sensor_01).state);
          }

      # PAGE 5: MQ-2 Gas/Smoke
      - id: page5
        lambda: |-
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "FLAMMABLE GAS");

          if (id(mq2_gas_01).has_state()) {
            it.print(10, 20, id(font_icon_large), "\U000F1A1B"); // mdi-gas-burner
            it.printf(55, 25, id(font_data_large), "%.1f%%", id(mq2_gas_01).state);
          }

      # PAGE 6: MQ-7 CO
      - id: page6
        lambda: |-
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "CARBON MONOXIDE");

          if (id(mq7_co_01).has_state()) {
            it.print(10, 20, id(font_icon_large), "\U000F12FE"); // mdi-molecule-co
            it.printf(55, 25, id(font_data_large), "%.1f%%", id(mq7_co_01).state);
          }      

      # PAGE 7: MQ-135 Air Quality
      - id: page7
        lambda: |-
          it.printf(64, 0, id(font_header), TextAlign::TOP_CENTER, "AIR QUALITY");

          if (id(mq135_gas_01).has_state()) {
            it.print(10, 20, id(font_icon_large), "\U000F07E4"); // mdi-molecule-co2
            it.printf(55, 25, id(font_data_large), "%.1f%%", id(mq135_gas_01).state);
          }

  # --- Display 2: 7-Segment MAX7219 (Numeric) ---
  - platform: max7219
    cs_pin: 5
    num_chips: 1
    intensity: 0 # <--- Change this number (from 0 to 15) to adjust brightness
    id: led_7seg
    lambda: |-
      auto time = id(relogio_sntp).now();

      // If time or temperature is not ready, show placeholders
      if (!time.is_valid() || !id(dht_temp_01).has_state()) {
        it.print("--C --.--");
        return;
      }

      // Fixed display: XX.XC (4 digits) + HH.MM (4 digits) 
      // Result format: "25.4C18.05"
      it.printf("%2.1fC%02d.%02d", id(dht_temp_01).state, time.hour, time.minute);

# ============================================================================
# Automation (Rotates OLED pages every 8 seconds)
# ============================================================================
interval:
  - interval: 8s
    then:
      - display.page.show_next: my_oled_display
      - component.update: my_oled_display
