# ============================================================================
# ESPHome Configuration - Sensor Node 01
# Remote sensor data collector for environmental monitoring
# Collects temperature, humidity, and displays data locally
# ============================================================================

esphome:
  name: sensor-node-01
  friendly_name: Sensor Node 01
  comment: "Remote data collector for environmental monitoring"
  min_version: 2025.11.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ============================================================================
# System Configuration & Network
# ============================================================================

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret node_api_encryption_key

ota:
  - platform: esphome
    password: !secret node_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP for recovery if WiFi connection fails
  ap:
    ssid: "Sensor-Node-01 Fallback"
    password: !secret node_fallback_ap_password

captive_portal:

web_server:
  port: 80

# ============================================================================
# Hardware Protocols
# ============================================================================

i2c:
  sda: 21
  scl: 22
  scan: true

# ============================================================================
# GPIO Outputs & Status LEDs
# ============================================================================

output:
  # GPIO 2: Status LED (for testing/diagnostics)
  - platform: gpio
    pin: 2
    id: status_led_output

light:
  # Status indicator LED - used for testing connectivity
  - platform: binary
    name: "Sensor Node 01 Status LED"
    output: status_led_output
    icon: mdi:led-on
    effects:
      - strobe:
          name: "Slow Blink"
          colors:
            - state: true
              duration: 1s
            - state: false
              duration: 1s
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              duration: 100ms
            - state: false
              duration: 100ms
      - strobe:
          name: "Alert Pattern"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms

# ============================================================================
# Sensor Components
# ============================================================================

# Temperature sensor
sensor:
  - platform: dht
    pin: 4
    model: DHT11
    temperature:
      name: "Temperature Sensor Node 01"
      id: temp_sensor_01
    humidity:
      name: "Humidity Sensor Node 01"
      id: humidity_sensor_01
    update_interval: 60s

# ============================================================================
# Display & Fonts
# ============================================================================

font:
  - file: "gfonts://Roboto"
    id: font_header
    size: 12
  - file: "gfonts://Roboto"
    id: font_data
    size: 18

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.print(0, 0, id(font_header), "MONITOR AMBIENTAL");

      if (id(temp_sensor_01).has_state()) {
        it.printf(0, 20, id(font_data), "Temp: %.1f C", id(temp_sensor_01).state);
      } else {
        it.print(0, 20, id(font_data), "Temp: Lendo...");
      }

      if (id(humidity_sensor_01).has_state()) {
        it.printf(0, 42, id(font_data), "Umid: %.1f %%", id(humidity_sensor_01).state);
      } else {
        it.print(0, 42, id(font_data), "Umid: Lendo...");
      }

