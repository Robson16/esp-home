# ESPHome Configuration - Sensor Node
# Remote sensor data collector for environmental monitoring
# Collects temperature, humidity, and other sensor data

esphome:
  name: sensor-node-01
  friendly_name: Sensor Node 01
  comment: "Remote data collector for environmental monitoring"
  min_version: 2025.11.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ============================================================================
# System Configuration
# ============================================================================

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: "R0gwPdxSK9p+Lm2jTA125NVyRjfjFYtv0ZPFrjQ2fbw="

ota:
  - platform: esphome
    password: "87c80a570f7290f11624dc8a541ec4e6"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP for recovery if WiFi connection fails
  ap:
    ssid: "Sensor-Node-01 Fallback"
    password: "NodeSecurePassword456"

captive_portal:

# ============================================================================
# Network & Web Interface
# ============================================================================

web_server:
  port: 80

# ============================================================================
# Hardware - GPIO Configuration
# ============================================================================

output:
  # GPIO 2: Status LED (for testing/diagnostics)
  - platform: gpio
    pin: 2
    id: status_led_output

# ============================================================================
# Light & Effects (Test/Diagnostic)
# ============================================================================

light:
  # Status indicator LED - used for testing connectivity
  - platform: binary
    name: "Sensor Node Status LED"
    output: status_led_output
    icon: mdi:led-on
    effects:
      - strobe:
          name: "Slow Blink"
          colors:
            - state: true
              duration: 1s
            - state: false
              duration: 1s
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              duration: 100ms
            - state: false
              duration: 100ms
      - strobe:
          name: "Alert Pattern"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms
